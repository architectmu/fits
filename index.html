<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fits — My Closet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Playfair+Display:wght@400;700&family=Amiri:wght@400;700&family=Caveat:wght@500;700&display=swap">
<style>
:root{--bg:#fff;--panel:#faf9f7;--card:#f3f2ef;--line:#ebe8e3;--ink:#111;--ink2:#3a3936;--muted:#8d8a84;--danger:#c4372d;--sel:#3b82f6;--shadow:0 1px 2px rgba(0,0,0,.04),0 8px 24px rgba(0,0,0,.07);--r:14px;--font:'Inter','IBM Plex Sans Arabic','Segoe UI',system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121212;--panel:#171717;--card:#212121;--line:#2b2b2b;--ink:#f2f2f2;--ink2:#d4d4d4;--muted:#8a8a8a;--shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.4)}}
:root[data-theme="dark"]{--bg:#121212;--panel:#171717;--card:#212121;--line:#2b2b2b;--ink:#f2f2f2;--ink2:#d4d4d4;--muted:#8a8a8a;--shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.4)}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;display:flex;flex-direction:column;overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:var(--line);border-radius:10px;border:2px solid transparent;background-clip:padding-box}
.i{flex:none;display:block}
[dir="rtl"] .rtl-flip{transform:scaleX(-1)}
.top{height:64px;flex:none;display:flex;align-items:center;gap:28px;padding:0 22px;border-bottom:1px solid var(--line);background:var(--bg)}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:36px;height:36px;border-radius:10px;background:linear-gradient(160deg,#fcfaf7,#ebe2d7);display:grid;place-items:center;color:#151515;box-shadow:0 1px 3px rgba(0,0,0,.1)}
.word{font-family:Inter,sans-serif;font-weight:800;font-size:23px;letter-spacing:-.05em}
#nav{display:flex;gap:4px;flex:1}
.nav-b{border:0;background:none;padding:8px 15px;border-radius:999px;color:var(--muted);font-weight:500}
.nav-b:hover{color:var(--ink);background:var(--card)}
.nav-b.on{background:var(--ink);color:var(--bg)}
.top-actions{display:flex;gap:6px;align-items:center}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--ink);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-weight:600;font-size:13.5px;white-space:nowrap}
.btn:hover{opacity:.86}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{background:var(--card);opacity:1}
.btn.sm{padding:6px 12px;font-size:12.5px}
.btn.danger{color:var(--danger)}
.btn:disabled{opacity:.4;cursor:default}
.icon-btn{width:36px;height:36px;display:grid;place-items:center;border:0;background:none;border-radius:10px;color:var(--ink2)}
.icon-btn:hover{background:var(--card)}
.icon-btn:disabled{opacity:.3;cursor:default;background:none}
.icon-btn.on{background:var(--ink);color:var(--bg)}
main#view{flex:1;min-height:0;display:flex}
.muted{color:var(--muted)}.sm{font-size:12.5px}
/* closet */
.closet{display:flex;flex:1;min-height:0}
.side{width:250px;flex:none;border-inline-end:1px solid var(--line);overflow:auto;padding:20px 14px 40px;background:var(--panel)}
.fg{margin-bottom:22px}
.fg h4{margin:0 0 8px;font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;padding-inline:10px}
.fg .chips{padding-inline:6px}
.cat{display:flex;width:100%;justify-content:space-between;align-items:center;border:0;background:none;padding:7px 10px;border-radius:9px;text-align:start;color:var(--ink2)}
.cat span{color:var(--muted);font-size:12px}
.cat:hover{background:var(--card)}
.cat.on{background:var(--ink);color:var(--bg)}.cat.on span{color:inherit;opacity:.7}
.cat.sub{padding-inline-start:26px;font-size:13px;position:relative}
.cat.sub::before{content:'';position:absolute;inset-inline-start:14px;top:50%;width:6px;height:1px;background:var(--muted)}
.csec h3 .crumb{color:var(--muted);font-weight:500}
.link{border:0;background:none;color:var(--muted);padding:6px 10px;font-size:12.5px}.link:hover{color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--bg);padding:5px 11px;border-radius:999px;font-size:12.5px;color:var(--ink2)}
.chip:hover{border-color:var(--muted)}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.chip small{opacity:.55;margin-inline-start:4px}
.chip-in{border:1px dashed var(--line);background:transparent;border-radius:999px;padding:5px 11px;width:90px;font-size:12.5px;outline:none}
.chip-in:focus{border-color:var(--ink);width:150px}
.swatches{display:flex;flex-wrap:wrap;gap:8px;padding-inline:6px}
.swb{width:24px;height:24px;border-radius:50%;border:1px solid rgba(128,128,128,.35);padding:0}
.swb.on{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--ink)}
.cmain{flex:1;min-width:0;overflow:auto;padding:22px 28px 60px}
.ctool{display:flex;gap:10px;align-items:center}
.ctool .sp{flex:1}
.search{flex:1;max-width:420px;display:flex;align-items:center;gap:8px;background:var(--card);border-radius:999px;padding:0 14px;color:var(--muted)}
.search input{border:0;background:none;outline:none;flex:1;padding:10px 0;color:var(--ink);min-width:0}
.search.sm input{padding:8px 0}
.sel{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:8px 12px;outline:none}
.stats{margin:16px 2px 0;color:var(--muted);font-size:13px}
.csec{margin-top:26px}
.csec h3{font-size:17px;margin:0 0 12px;display:flex;gap:8px;align-items:baseline;font-weight:700;letter-spacing:-.01em}
.csec h3 span{color:var(--muted);font-weight:500;font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:16px}
.card{cursor:pointer;position:relative}
.card-img{aspect-ratio:4/5;background:var(--card);border-radius:var(--r);position:relative;overflow:hidden;transition:transform .15s,box-shadow .15s}
/* absolutely placed so tall photos are fitted inside the 4:5 box instead of overflowing it and getting clipped */
.card-img img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;padding:14px}
.card:hover .card-img{transform:translateY(-2px);box-shadow:var(--shadow)}
.card-img{position:relative}
.card-img .alt{position:absolute;inset:0;opacity:0;transition:opacity .2s}
.card:hover .card-img.has-alt .alt{opacity:1}
.card:hover .card-img.has-alt img:first-child{opacity:0}
.card-img .pc{position:absolute;bottom:8px;inset-inline-start:8px;background:var(--bg);color:var(--ink2);font-size:11px;font-weight:600;padding:2px 7px;border-radius:999px;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.im-img{position:relative}
.im-img.drop{outline:2px dashed var(--ink);outline-offset:-8px}
.im-badge{position:absolute;top:12px;inset-inline-end:12px;background:var(--bg);font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px}
.im-badge:empty{display:none}
.im-thumbs{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;align-items:center}
.imt{width:58px;height:70px;border-radius:10px;border:2px solid transparent;background:var(--card);padding:0;overflow:hidden;position:relative;display:grid;place-items:center}
.imt img{width:100%;height:100%;object-fit:contain;padding:4px}
.imt.on{border-color:var(--ink)}
.imt em{position:absolute;bottom:0;inset-inline:0;font-style:normal;font-size:9.5px;font-weight:600;background:rgba(0,0,0,.55);color:#fff;text-align:center;padding:1px 0}
.imt.add{border:1.5px dashed var(--line);color:var(--muted);background:none}
.imt.add:hover{border-color:var(--ink);color:var(--ink)}
.imt-acts{display:flex;gap:6px;margin-inline-start:auto}
.card-meta{padding:8px 4px 0;display:flex;flex-direction:column;gap:1px;min-width:0}
.card-meta b{font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-meta span{color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .fav{position:absolute;top:10px;inset-inline-end:10px;color:#d9534f}
.card .fav svg,.fav-btn.on svg{fill:currentColor}
.empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:70px 20px;gap:10px}
.empty .big{width:88px;height:88px;border-radius:24px;background:linear-gradient(160deg,#fcfaf7,#ebe2d7);display:grid;place-items:center;color:#151515;margin-bottom:8px;box-shadow:var(--shadow)}
.empty h2{margin:0;font-size:22px;letter-spacing:-.02em}.empty p{margin:0 0 10px;color:var(--muted);max-width:400px;line-height:1.7}
.drop-ov{position:fixed;inset:12px;border:2px dashed var(--ink);border-radius:20px;background:color-mix(in srgb,var(--bg) 88%,transparent);display:none;place-items:center;font-size:20px;font-weight:700;z-index:50;pointer-events:none}
body.dragging .drop-ov{display:grid}
/* boards */
.page{flex:1;overflow:auto;padding:28px 32px 60px}
.page-h{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:22px;gap:16px}
.page-h h1{margin:0;font-size:28px;letter-spacing:-.03em}
.page-h p{margin:4px 0 0}
.bgrid{display:grid;gap:20px;grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
.bgrid.mood{grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
.bcard{cursor:pointer;position:relative}
.bthumb{border-radius:var(--r);overflow:hidden;background:var(--card);aspect-ratio:1;border:1px solid var(--line);transition:box-shadow .15s}
.mood .bthumb{aspect-ratio:16/10}
.bcard:hover .bthumb{box-shadow:var(--shadow)}
.bthumb img{width:100%;height:100%;object-fit:cover;display:block}
.bmeta{padding:9px 4px 0;display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.bmeta b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.bmeta span{color:var(--muted);font-size:12px;flex:none}
.bact{position:absolute;top:10px;inset-inline-end:10px;display:flex;gap:6px;opacity:0;transition:.15s}
.bcard:hover .bact{opacity:1}
.bact button{width:32px;height:32px;border-radius:9px;border:0;background:var(--bg);box-shadow:var(--shadow);display:grid;place-items:center}
.bact button:hover{color:var(--danger)}
/* editor */
.editor{flex:1;display:flex;min-height:0}
.ed-l{width:280px;flex:none;border-inline-end:1px solid var(--line);display:flex;flex-direction:column;gap:10px;padding:16px;background:var(--panel);min-height:0}
.ed-l .search{max-width:none;flex:none}
.ed-l .sel{border-radius:10px}
.ed-items{flex:1;overflow:auto;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;align-content:start}
.ei{aspect-ratio:4/5;background:var(--card);border-radius:10px;display:grid;place-items:center;cursor:grab;overflow:hidden;position:relative}
.ei img{width:100%;height:100%;object-fit:contain;padding:6px;pointer-events:none}
.ei:hover{outline:2px solid var(--ink)}
.ei.used::after{content:'';position:absolute;top:6px;inset-inline-end:6px;width:7px;height:7px;border-radius:50%;background:var(--sel)}
.ed-add{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.ed-add .btn{justify-content:center;flex-direction:column;gap:4px;border-radius:12px;padding:10px 4px}
.ed-c{flex:1;min-width:0;display:flex;flex-direction:column}
.ed-top{display:flex;align-items:center;gap:8px;padding:8px 14px;border-bottom:1px solid var(--line)}
.name-in{border:0;background:none;font-size:18px;font-weight:700;letter-spacing:-.02em;outline:none;padding:6px 8px;border-radius:8px;min-width:0;flex:1;max-width:380px}
.name-in:hover,.name-in:focus{background:var(--card)}
.ed-tools{display:flex;align-items:center;gap:4px;margin-inline-start:auto}
.colorpick{width:30px;height:30px;border-radius:50%;overflow:hidden;border:1px solid var(--line);position:relative;cursor:pointer;flex:none;display:block}
.colorpick input{position:absolute;inset:-10px;width:54px;height:54px;border:0;padding:0;cursor:pointer}
.selbar{height:50px;flex:none;display:flex;align-items:center;justify-content:center;gap:4px;padding:0 16px;border-bottom:1px solid var(--line);font-size:12.5px}
.selbar .dv{width:1px;height:22px;background:var(--line);margin:0 6px}
.selbar select,.selbar input[type=number]{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:5px 8px;outline:none}
.selbar input[type=number]{width:64px}
.stage-wrap{flex:1;min-height:0;position:relative;overflow:hidden;background:var(--panel);background-image:radial-gradient(var(--line) 1.2px,transparent 1.2px);background-size:22px 22px}
.stage-box{position:absolute;box-shadow:0 2px 6px rgba(0,0,0,.06),0 24px 60px rgba(0,0,0,.12);border-radius:3px}
.stage{position:absolute;left:0;top:0;transform-origin:0 0;overflow:hidden;user-select:none;touch-action:none;--inv:1}
.el{position:absolute;cursor:move}
.el-in{width:100%;height:100%}
.el-in img{width:100%;height:100%;object-fit:contain;display:block;pointer-events:none}
.el .txt{width:100%;height:100%;white-space:pre-wrap;word-break:break-word;line-height:1.2;outline:none}
.el .txt[contenteditable="true"]{user-select:text;cursor:text;outline:calc(1px * var(--inv)) dashed var(--sel)}
.el .sw{width:100%;height:100%;border-radius:calc(6px * var(--inv))}
.el .missing{width:100%;height:100%;display:grid;place-items:center;border:2px dashed #bbb;color:#999;font-size:24px}
.hd{position:absolute;width:calc(13px * var(--inv));height:calc(13px * var(--inv));background:#fff;border:calc(1.5px * var(--inv)) solid var(--sel);border-radius:50%;display:none;z-index:2}
.el.sel{outline:calc(1.5px * var(--inv)) solid var(--sel)}
.el.sel .hd{display:block}
.hd.nw{left:0;top:0;transform:translate(-50%,-50%);cursor:nwse-resize}
.hd.ne{right:0;top:0;transform:translate(50%,-50%);cursor:nesw-resize}
.hd.sw{left:0;bottom:0;transform:translate(-50%,50%);cursor:nesw-resize}
.hd.se{right:0;bottom:0;transform:translate(50%,50%);cursor:nwse-resize}
.hd.rot{left:50%;top:calc(-30px * var(--inv));transform:translateX(-50%);cursor:grab;background:var(--sel)}
/* planner */
.cal-wrap{max-width:1100px}
.cal-nav{display:flex;align-items:center;gap:6px}
.cal-nav h2{margin:0 8px;font-size:18px;min-width:170px;text-align:center}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
.wd{font-size:12px;color:var(--muted);text-align:center;padding:4px;font-weight:600}
.day{aspect-ratio:1/1.12;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:7px;display:flex;flex-direction:column;align-items:stretch;gap:4px;text-align:start;overflow:hidden;min-width:0}
.day:hover{border-color:var(--muted)}
.day.blank{visibility:hidden}
.day.past{opacity:.6}
.day .dn{font-size:12.5px;font-weight:600;color:var(--ink2);width:24px;height:24px;display:grid;place-items:center;flex:none}
.day.today .dn{background:var(--ink);color:var(--bg);border-radius:999px}
.day img{flex:1;min-height:0;width:100%;object-fit:contain;border-radius:8px;background:var(--card)}
.day .dl{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* modal */
#modal-root .ov{position:fixed;inset:0;background:rgba(10,10,10,.38);display:grid;place-items:center;z-index:100;padding:24px;animation:fade .15s}
@keyframes fade{from{opacity:0}}
.md{background:var(--bg);border-radius:20px;box-shadow:0 30px 80px rgba(0,0,0,.28);width:min(440px,100%);max-height:calc(100vh - 48px);overflow:auto;padding:24px}
.md.wide{width:min(920px,100%)}
.md h2{margin:0 0 16px;font-size:20px;letter-spacing:-.02em}
.md-f{display:flex;gap:8px;align-items:center;justify-content:flex-end;margin-top:18px}
.md-f .sp{flex:1}
.fld{display:flex;flex-direction:column;gap:7px;margin-bottom:14px}
.fld>span{font-size:12px;font-weight:600;color:var(--muted)}
.fld input,.fld select,.fld textarea,.txt-in{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:9px 12px;outline:none;resize:vertical}
.fld input:focus,.fld select:focus,.fld textarea:focus,.txt-in:focus{border-color:var(--ink)}
.fld .chips,.fld .swatches{padding-inline:0}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.item-md{display:grid;grid-template-columns:1fr 1.15fr;gap:26px}
.im-img{aspect-ratio:4/5;border-radius:16px;overflow:hidden}
/* absolutely placed so tall photos are fitted inside the 4:5 box instead of overflowing it */
.im-img img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;padding:18px}
.checker{background-color:var(--card);background-image:linear-gradient(45deg,rgba(128,128,128,.08) 25%,transparent 25%,transparent 75%,rgba(128,128,128,.08) 75%),linear-gradient(45deg,rgba(128,128,128,.08) 25%,transparent 25%,transparent 75%,rgba(128,128,128,.08) 75%);background-size:20px 20px;background-position:0 0,10px 10px}
.bgt{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:12px}
.tol{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.tol input{width:90px}
.im-head{display:flex;gap:8px;align-items:center;margin-bottom:14px}
.title-in{flex:1;min-width:0;border:0;font-size:22px;font-weight:700;outline:none;background:none;letter-spacing:-.02em;padding:4px 0;border-bottom:1px solid transparent}
.title-in:focus{border-bottom-color:var(--line)}
.fav-btn{border:1px solid var(--line);background:none;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--muted);flex:none}
.fav-btn.on{color:#d9534f}
.add-prev{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:16px}
.ap{width:88px;height:108px;flex:none;border-radius:10px;background:var(--card);overflow:hidden;position:relative}
.ap img{width:100%;height:100%;object-fit:cover}
.ap.done::after{content:'✓';position:absolute;inset:0;display:grid;place-items:center;background:rgba(0,0,0,.45);color:#fff;font-size:26px;font-weight:700}
.check{display:flex;gap:8px;align-items:center;margin:4px 0 6px;font-size:13.5px}
.pick-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;max-height:56vh;overflow:auto}
.pick{border:1px solid var(--line);border-radius:12px;background:var(--bg);padding:6px;text-align:start;display:flex;flex-direction:column;gap:6px}
.pick:hover,.pick.on{border-color:var(--ink)}
.pick img,.pick .ph{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;background:var(--card)}
.pick span{font-size:12.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg{display:inline-flex;background:var(--card);border-radius:999px;padding:3px}
.seg button{border:0;background:none;padding:6px 14px;border-radius:999px;font-size:13px}
.seg button.on{background:var(--bg);box-shadow:0 1px 3px rgba(0,0,0,.12);font-weight:600}
.set-row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.set-row:last-of-type{border-bottom:0}
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;opacity:0;transition:.2s;pointer-events:none;z-index:200;font-weight:500}
#toast.show{opacity:1;transform:translateX(-50%)}
.md.xwide{width:min(1180px,100%)}
#profiles{position:fixed;inset:0;z-index:90;background:var(--bg);display:grid;place-items:center;overflow:auto;padding:40px 20px}
#profiles[hidden]{display:none}
.pf-wrap{text-align:center;max-width:960px}
.pf-logo{display:inline-flex;align-items:center;gap:12px;margin-bottom:26px}
.pf-logo .logo{width:46px;height:46px;border-radius:13px}
.pf-logo .word{font-size:30px}
#profiles h1{font-size:30px;letter-spacing:-.03em;margin:0 0 36px;font-weight:700}
.pf-grid{display:flex;flex-wrap:wrap;justify-content:center;gap:30px}
.pf{display:flex;flex-direction:column;align-items:center;gap:8px;width:140px}
.pf-av{width:128px;height:128px;border-radius:50%;border:0;padding:0;overflow:hidden;cursor:pointer;background:var(--card);display:grid;place-items:center;transition:transform .15s,box-shadow .15s;box-shadow:var(--shadow)}
.pf-av:hover,.pf.cur .pf-av{box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--ink)}
.pf-av:hover{transform:translateY(-3px)}
.pf-av img,.pe-av img,.prof-chip img{width:100%;height:100%;object-fit:cover;display:block}
.av-init{width:100%;height:100%;display:grid;place-items:center;color:#fff;font-weight:700}
.pf-av.add{background:none;border:2px dashed var(--line);color:var(--muted);box-shadow:none}
.pf-av.add:hover{border-color:var(--ink);color:var(--ink)}
.pf b{font-size:15px;font-weight:600;margin-top:4px}
.pf-foot{display:flex;gap:12px;justify-content:center;align-items:center;margin-top:38px}
.pf-edit{border:0;background:none;color:var(--muted);font-size:12.5px;padding:3px 10px;border-radius:8px}
.pf-edit:hover{color:var(--ink);background:var(--card)}
.prof-chip{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:3px 12px 3px 3px;font-weight:600;font-size:13px;max-width:180px}
.prof-chip:empty{display:none}
.prof-chip:hover{background:var(--card)}
.pc-av{width:28px;height:28px;border-radius:50%;overflow:hidden;flex:none}
.pc-name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pe{display:flex;gap:18px;align-items:center;margin-bottom:18px}
.pe-av{width:96px;height:96px;border-radius:50%;overflow:hidden;flex:none;background:var(--card)}
.pe-btns{display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.imp-opts{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:18px 0}
.imp-opt{border:1px solid var(--line);background:var(--bg);border-radius:16px;padding:18px;text-align:start;display:flex;flex-direction:column;gap:6px}
.imp-opt:hover{border-color:var(--ink);box-shadow:var(--shadow)}
.imp-opt b{font-size:15px}.imp-opt span{color:var(--muted);font-size:12.5px;line-height:1.6}
.imp-help{background:var(--panel);border-radius:12px;padding:12px 16px;font-size:13px;line-height:1.8}
.imp-help summary{cursor:pointer;font-weight:600}
.imp-help ol{margin:8px 0 0;padding-inline-start:20px}
.imp-help code{background:var(--card);padding:1px 6px;border-radius:6px;font-size:12px}
.imp-bulk{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 12px;background:var(--panel);border-radius:12px;margin-bottom:10px}
.imp-bulk select,.imp-bulk input[type=text]{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:6px 10px;outline:none}
.imp-rows{max-height:52vh;overflow:auto;border:1px solid var(--line);border-radius:12px}
.ir{display:grid;grid-template-columns:28px 56px 1.3fr 1fr 1fr 1.1fr 1fr 40px;gap:8px;align-items:center;padding:6px 10px;border-bottom:1px solid var(--line)}
.ir:last-child{border-bottom:0}
.ir.head{position:sticky;top:0;background:var(--bg);z-index:1;font-size:11.5px;font-weight:600;color:var(--muted)}
.ir.off{opacity:.4}
.ir img{width:56px;height:64px;object-fit:contain;background:var(--card);border-radius:8px}
.ir input[type=text],.ir select{width:100%;min-width:0;border:1px solid transparent;background:transparent;border-radius:8px;padding:6px 8px;outline:none}
.ir input[type=text]:hover,.ir select:hover,.ir input[type=text]:focus{border-color:var(--line);background:var(--bg)}
.ir .st{font-size:12px;color:var(--muted);text-align:center}
.ir .st.ok{color:#2f8f4e}.ir .st.err{color:var(--danger)}
@media (max-width:820px){.side{display:none}.item-md{grid-template-columns:1fr}.ed-l{width:200px}#nav .nav-b{padding:8px 10px}}
</style>

/* RMBG-1.4 segmentation via transformers.js: WebGPU when available (~0.4s/photo), CPU otherwise */
const TF_LIB='https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.5.1',RMBG='briaai/RMBG-1.4';
const RMBG_PROC={do_normalize:true,do_pad:false,do_rescale:true,do_resize:true,image_mean:[0.5,0.5,0.5],feature_extractor_type:'ImageFeatureExtractor',image_std:[1,1,1],resample:2,rescale_factor:0.00392156862745098,size:{width:1024,height:1024}};

function loadSeg(){if(!seg)seg=(async()=>{const T=await import(TF_LIB);
  const progress_callback=p=>{if(p.status==='progress'&&aiStatus)aiStatus(t('aiDownloading',{p:Math.round(p.progress||0)}))};
  const opts=device=>({config:{model_type:'custom'},dtype:'fp32',progress_callback,...(device?{device}:{})});let model;
  try{if(!navigator.gpu||!await navigator.gpu.requestAdapter())throw new Error('no webgpu');model=await T.AutoModel.from_pretrained(RMBG,opts('webgpu'))}
  catch(e){model=await T.AutoModel.from_pretrained(RMBG,opts())}
  return {T,model,proc:await T.AutoProcessor.from_pretrained(RMBG,{config:RMBG_PROC})}})().catch(e=>{seg=null;throw e});return seg}
function aiMask(c){const run=segQ.then(async()=>{const {T,model,proc}=await loadSeg(),img=await T.RawImage.fromURL(c.toDataURL('image/png'));
  const {pixel_values}=await proc(img),{output}=await model({input:pixel_values});
  return (await T.RawImage.fromTensor(output[0].mul(255).to('uint8')).resize(img.width,img.height)).data});
 segQ=run.catch(()=>{});return run}

 try{const m=await aiMask(c),o=mkCanvas(c.width,c.height),ctx=o.getContext('2d');ctx.drawImage(c,0,0);
  const id=ctx.getImageData(0,0,o.width,o.height);for(let i=0;i<m.length;i++)id.data[i*4+3]=m[i];ctx.putImageData(id,0,0);return trim(o)}
 catch(e){console.warn('AI cut-out failed',e);if(!aiWarned){aiWarned=true;toast(t('aiFail'))}return trim(removeBg(c,30))}}

 let h=`<button class="icon-btn" data-a="front" title="${t('front')} ( ] )">${ic('up')}</button><button class="icon-btn" data-a="back" title="${t('backward')} ( [ )">${ic('down')}</button>
  <button class="icon-btn" data-a="dup" title="${t('duplicate')} (Ctrl+D)">${ic('copy')}</button>`;
 if(e.kind!=='text')h+=`<button class="icon-btn ${e.flip?'on':''}" data-a="flip" title="${t('flip')}">${ic('flip')}</button>`;
 const nPh=e.kind==='item'?itemPhotos(itemById(e.itemId)||{img:''}).length:1;
 if(nPh>1)h+=`<button class="btn ghost sm" data-a="photo" title="${t('swapPhoto')}">${ic('image',15)} ${(e.pi||0)+1}/${nPh}</button>`;
 if(e.kind==='text')h+=`<span class="dv"></span>${fontSelect(e.font)}
  <input type="number" data-p="size" min="8" max="400" value="${Math.round(e.size)}" title="${t('size')}">

  <select data-p="align" title="${t('align')}">${['left','center','right'].map(a=>`<option value="${a}" ${e.align===a?'selected':''}>${{left:'⇤',center:'↔',right:'⇥'}[a]}</option>`).join('')}</select>`;
 if(e.kind==='text'||e.kind==='swatch')h+=`<label class="colorpick" title="${t('color')}" style="background:${e.color}"><input type="color" data-p="color" value="${e.color}"></label>`;
 h+=boardToolsHTML(e);
 h+=`<span class="dv"></span><button class="icon-btn" data-a="del" title="${t('delete')} (Del)" style="color:var(--danger)">${ic('trash')}</button>`;
 bar.innerHTML=h;
 bar.onclick=ev=>{const cr=ev.target.closest('[data-crop]')?.dataset.crop,nc=ev.target.closest('[data-note]')?.dataset.note;
  if(cr){applyCrop(e,CROP_PRESETS[cr]);renderStage();renderSelbar();commit();return}
  if(nc){e.color=nc;renderStage();renderSelbar();commit();return}
  const a=ev.target.closest('[data-a]')?.dataset.a;if(a)selAction(a)};
 bar.oninput=ev=>{const bt=boardToolsInput(ev.target,e);
  if(bt){const n=$(`#stage .el[data-id="${e.id}"]`);if(!n)return;if(bt==='style'||bt==='all')n.style.cssText=elStyle(e);
   if(bt==='inner'||bt==='all'){const inn=$('.el-in',n);inn.style.cssText=elInStyle(e);inn.innerHTML=elInner(e)}return}
  const p=ev.target.dataset.p;if(!p)return;const v=ev.target.value;e[p]=p==='size'?Math.max(8,+v||e.size):v;if(p==='color')ev.target.parentNode.style.background=v;
  const node=$(`#stage .el[data-id="${e.id}"] .el-in`);if(node)node.innerHTML=elInner(e)};
 bar.onchange=ev=>{if(ev.target.dataset.p||ev.target.dataset.bt||ev.target.dataset.cs)commit()}}
function selAction(a){const b=board(),e=selEl();if(!e)return;const zs=b.elements.map(x=>x.z);
 const bt=boardToolsAction(a,e,b);if(bt){if(bt==='bar')renderSelbar();else{renderStage();renderSelbar();commit()}return}
 if(a==='front')e.z=Math.max(...zs)+1;else if(a==='back')e.z=Math.min(...zs)-1;else if(a==='flip')e.flip=!e.flip;else if(a==='bold')e.bold=!e.bold;
 else if(a==='photo'){const n=itemPhotos(itemById(e.itemId)).length;e.pi=((e.pi||0)+1)%n}
 else if(a==='dup'){const n={...e,id:uid(),x:e.x+30,y:e.y+30,z:Math.max(...zs)+1};b.elements.push(n);st.ed.sel=n.id}
 else if(a==='del'){b.elements=b.elements.filter(x=>x!==e);st.ed.sel=null}
 renderStage();renderSelbar();renderEdItems();commit()}
function addEl(part,at){const b=board(),z=b.elements.length?Math.max(...b.elements.map(e=>e.z))+1:1,e={id:uid(),r:0,flip:false,z,...part};
 at=at||{x:b.W/2+(Math.random()-.5)*120,y:b.H/2+(Math.random()-.5)*120};e.x=at.x-e.w/2;e.y=at.y-e.h/2;
 b.elements.push(e);st.ed.sel=e.id;renderStage();renderSelbar();renderEdItems();commit()}

function pushHist(){const h=st.ed,s=snap();if(h.hist[h.hi]===s)return;h.hist=h.hist.slice(0,h.hi+1);h.hist.push(s);if(h.hist.length>100)h.hist.shift();h.hi=h.hist.length-1;updUndo()}

 if(!b.elements.some(e=>e.id===h.sel))h.sel=null;renderStage();renderSelbar();renderEdItems();updUndo();scheduleSave()}
const undo=()=>{if(st.ed.hi>0)restoreHist(st.ed.hi-1)},redo=()=>{if(st.ed.hi<st.ed.hist.length-1)restoreHist(st.ed.hi+1)};

const kwHit=(s,k)=>/[a-z]/.test(k)?new RegExp('(^|[^a-z])'+k.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).test(s):s.includes(k);
function guessCat(text){const s=String(text||'').toLowerCase().replace(/[_\-\/\\.]+/g,' ');if(!s.trim())return '';
 for(const c of st.settings.customCats)if(s.includes(c.name.toLowerCase()))return c.id;
 for(const [id,kws] of CAT_KW)if(kws.some(k=>kwHit(s,k)))return refineCat(id,s);return ''}
const MAT_ALL=[...MATERIALS.en,...MATERIALS.ar,'Acrylic','Elastane','Mohair','Merino','Alpaca','Satin','Velvet','Tweed','Canvas'];
function guessMaterials(text){const s=String(text||'').toLowerCase();return [...new Set(MAT_ALL.filter(m=>kwHit(s,m.toLowerCase())).map(matCanon))]}
const COLOR_SYN={gray:'grey',charcoal:'grey',cream:'beige',ecru:'beige',khaki:'beige',sand:'beige',camel:'brown',tan:'brown',chocolate:'brown',maroon:'burgundy',wine:'burgundy',bordeaux:'burgundy',ivory:'white','off white':'white',denim:'blue',sky:'blue',teal:'green',mint:'green',forest:'green',lilac:'purple',lavender:'purple',mustard:'yellow',gold:'yellow',coral:'orange',rose:'pink','رصاصي':'grey','سماوي':'blue','كريمي':'beige','موف':'purple','لبني':'blue'};
function guessColors(text){const s=String(text||'').toLowerCase(),out=new Set();if(!s.trim())return [];
 COLORS.forEach(c=>{if(kwHit(s,c[2].toLowerCase())||s.includes(c[3]))out.add(c[0])});for(const k in COLOR_SYN)if(kwHit(s,k))out.add(COLOR_SYN[k]);return [...out]}
function guessSeasons(text){const s=String(text||'').toLowerCase();return SEASONS.filter(x=>kwHit(s,x[1].toLowerCase())||s.includes(x[2])||(x[0]==='autumn'&&kwHit(s,'fall'))).map(x=>x[0])}
const splitList=s=>String(s||'').split(/[,;|\/]+/).map(x=>x.replace(/\d+(\.\d+)?\s*%/g,'').trim()).filter(Boolean);
function parseCSV(s){s=s.replace(/^﻿/,'');const first=s.split(/\r?\n/)[0],delim=[',',';','\t'].sort((a,b)=>first.split(b).length-first.split(a).length)[0];
 const rows=[];let row=[],f='',q=false;
 for(let i=0;i<s.length;i++){const ch=s[i];
  if(q){if(ch==='"'){if(s[i+1]==='"'){f+='"';i++}else q=false}else f+=ch}
  else if(ch==='"')q=true;else if(ch===delim){row.push(f);f=''}
  else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&s[i+1]==='\n')i++;row.push(f);rows.push(row);row=[];f=''}else f+=ch}
 if(f||row.length){row.push(f);rows.push(row)}
 const head=(rows.shift()||[]).map(h=>h.trim());return rows.filter(r=>r.some(x=>x.trim())).map(r=>Object.fromEntries(head.map((h,i)=>[h,r[i]??''])))}
function findArray(o){if(Array.isArray(o)&&o.some(x=>x&&typeof x==='object'&&!Array.isArray(x)))return o.filter(x=>x&&typeof x==='object');
 let best=[];if(o&&typeof o==='object')for(const v of Object.values(o)){const a=findArray(v);if(a.length>best.length)best=a}return best}
function normRecord(o){const flat={};const walk=(x,p)=>{for(const [k,v] of Object.entries(x)){if(v&&typeof v==='object'&&!Array.isArray(v))walk(v,p+k+'.');
  else flat[(p+k).toLowerCase()]=Array.isArray(v)?v.map(z=>z&&typeof z==='object'?(z.name||z.url||z.title||''):z).filter(Boolean).join(', '):v}};walk(o,'');
 const has=k=>flat[k]!=null&&String(flat[k]).trim()!=='',keys=Object.keys(flat);
 const pick=(...want)=>{for(const w of want)for(const k of keys)if(k.replace(/[.\s_-]/g,'')===w&&has(k))return String(flat[k]).trim();
  for(const w of want)for(const k of keys)if(k.split('.').pop().replace(/[\s_-]/g,'')===w&&has(k))return String(flat[k]).trim();return ''};
 return {name:pick('name','title','itemname','productname'),brand:pick('brand','brandname','designer','label','maker'),category:pick('subcategory','category','categoryname','type','itemtype','kind'),
  materials:pick('materials','material','fabric','composition'),color:pick('color','colour','colors','colours'),season:pick('seasons','season'),notes:pick('notes','note','description','comment'),
  image:pick('image','imageurl','images','photo','photourl','photos','picture','pictures','img','imagepath','file','filename','path','thumbnail','src','url').split(/,\s+/)[0]}}
function parseData(text,fname){const tx=text.replace(/^﻿/,'').trim();
 const recs=(/\.json$/i.test(fname)||tx[0]==='['||tx[0]==='{')?findArray(JSON.parse(tx)):parseCSV(tx);
 return recs.map(normRecord).filter(r=>r.image||r.name||r.brand)}
function rowFromParts(file,segs){const fname=segs[segs.length-1],folders=segs.slice(0,-1).reverse();
 let base=fname.replace(/\.[^.]+$/,'').replace(/_+/g,' ').trim(),brand='';const parts=base.split(/\s+-\s+/);
 if(parts.length>1){brand=parts[0].trim();base=parts.slice(1).join(' - ').trim()}
 let category='';for(const f of folders){category=guessCat(f);if(category)break}category=refineCat(category||guessCat(base)||'other',base);
 const r={file,name:base,brand,category,materials:guessMaterials(base),colors:guessColors(base),seasons:guessSeasons(folders.join(' ')),notes:''};
 if(/^((img|dsc|pxl|photo|image|screenshot|whatsapp|fullsizerender)[\s\d()-]*|[\d\s()-]+)$/i.test(base))r.name='';return r}
const imgKey=s=>String(s||'').split(/[\/\\?#]/).filter(Boolean).pop()?.toLowerCase()||'';
function rowFromRecord(r){const remote=/^(https?:|data:)/i.test(r.image);
 return {file:null,src:remote?r.image:'',key:remote?'':imgKey(r.image),name:r.name,brand:r.brand,category:refineCat(guessCat(r.category)||guessCat(r.name)||'other',r.name),
  materials:r.materials?splitList(r.materials).map(matCanon):guessMaterials(r.name),colors:guessColors(r.color),seasons:guessSeasons(r.season),notes:r.notes}}
function matchImages(rows,files){const map=new Map();files.forEach(f=>{const k=f.name.toLowerCase();map.set(k,f);map.set(k.replace(/\.[^.]+$/,''),f)});let n=0;
 rows.forEach(r=>{if(r.file||r.src||!r.key)return;const f=map.get(r.key)||map.get(r.key.replace(/\.[^.]+$/,''));if(f){r.file=f;n++}});return n}

/* ---------- auto-sync: watch a folder (e.g. iCloud Drive\Fits) for new items ---------- */
const SYNC={handle:null,seen:new Set(),cut:true,timer:null,busy:false,ok:false};
async function loadSync(){const m=(await DB.all('meta')).find(x=>x.id==='sync');if(m){SYNC.handle=m.handle||null;SYNC.seen=new Set(m.seen||[]);SYNC.cut=m.cut!==false}}
const saveSync=()=>DB.put('meta',{id:'sync',handle:SYNC.handle,seen:[...SYNC.seen],cut:SYNC.cut});
async function syncPerm(ask){if(!SYNC.handle)return false;const o={mode:'read'};try{let p=await SYNC.handle.queryPermission(o);if(p!=='granted'&&ask)p=await SYNC.handle.requestPermission(o);return p==='granted'}catch(e){return false}}
async function scanDir(dir,path=[]){const out=[];for await(const [name,h] of dir.entries()){if(name.startsWith('.'))continue;
 if(h.kind==='directory')out.push(...await scanDir(h,[...path,name]));else if(/\.(jpe?g|png|webp|gif|heic|heif|avif|bmp)$/i.test(name))out.push({h,path,name})}return out}
const fileKey=(f,file)=>[...f.path,f.name].join('/')+'|'+file.size+'|'+file.lastModified;
function startSync(){clearInterval(SYNC.timer);SYNC.timer=setInterval(syncNow,30000);syncNow()}
async function syncNow(){if(SYNC.busy||!SYNC.handle)return;SYNC.ok=await syncPerm(false);updSyncBadge();if(!SYNC.ok)return;SYNC.busy=true;let n=0;
 try{for(const f of await scanDir(SYNC.handle)){const file=await f.h.getFile(),key=fileKey(f,file);if(SYNC.seen.has(key))continue;
   try{const r=rowFromParts(file,[...f.path,f.name]),it=mkItem(r,await processFile(file,SYNC.cut));it.inbox=true;await DB.put('items',it);st.items.push(it);n++}catch(e){console.warn('sync',f.name,e)}
   SYNC.seen.add(key);await saveSync()}}
 catch(e){console.warn(e)}finally{SYNC.busy=false}
 if(n){toast(t('syncAdded',{n}));if(st.view==='closet')renderCloset()}}
function updSyncBadge(){const b=$('#syncBtn');if(!b)return;b.hidden=!SYNC.handle;b.innerHTML=SYNC.ok?`<span style="color:#2f8f4e">●</span> ${t('syncOn')}`:`${ic('redo',14)} ${t('syncResume')}`}
async function onSyncBadge(){if(SYNC.ok)return openSyncModal();if(await syncPerm(true))startSync();else openSyncModal()}
function openSyncModal(){
 const md=modal(`<h2>${t('syncTitle')}</h2><div class="imp-help" style="margin-bottom:14px">${t('syncHow')}</div>
  ${SYNC.handle?`<div class="set-row"><span>${t('syncFolder')}: <b>${esc(SYNC.handle.name)}</b></span><span class="muted sm">${SYNC.ok?t('syncOn'):t('syncPaused')}</span></div>`:''}
  <label class="check"><input type="checkbox" id="syExisting" ${SYNC.handle?'':'checked'}> ${t('syncExisting')}</label>
  <label class="check"><input type="checkbox" id="syCut" ${SYNC.cut?'checked':''}> ${t('impCutLabel')}</label>
  <div class="md-f">${SYNC.handle?`<button class="btn ghost danger" id="syOff">${t('syncOff')}</button><span class="sp"></span><button class="btn ghost" id="syNow">${t('syncCheck')}</button>`:''}
   <button class="btn" id="syPick">${SYNC.handle?t('syncChange'):t('syncChoose')}</button></div>`,{wide:true});
 $('#syCut',md).onchange=e=>{SYNC.cut=e.target.checked;saveSync()};
 $('#syPick',md).onclick=async()=>{if(!window.showDirectoryPicker)return toast(t('syncUnsupported'));let h;try{h=await showDirectoryPicker({id:'fits-sync',mode:'read'})}catch(e){return}
  SYNC.handle=h;SYNC.seen=new Set();
  if(!$('#syExisting',md).checked){for(const f of await scanDir(h))SYNC.seen.add(fileKey(f,await f.h.getFile()))}
  await saveSync();closeModal();toast(t('syncOn'));startSync()};
 if(SYNC.handle){$('#syOff',md).onclick=async()=>{clearInterval(SYNC.timer);SYNC.handle=null;SYNC.ok=false;SYNC.seen=new Set();await saveSync();updSyncBadge();closeModal()};
  $('#syNow',md).onclick=async()=>{if(await syncPerm(true)){closeModal();startSync()}}}}

 if(navigator.storage&&navigator.storage.estimate)navigator.storage.estimate().then(e=>{const el=$('#sUse');if(el)el.textContent=`${t('storage')}: ${(e.usage/1048576).toFixed(1)} MB`});
 $('#sLang',md).onclick=e=>{const v=e.target.dataset.v;if(!v||v===lang)return;closeModal();setLang(v);openSettings()};
 $('#sTheme',md).onclick=e=>{const v=e.target.dataset.v;if(!v)return;lsSet('fits-theme',v);applyTheme();$$('#sTheme button',md).forEach(b=>b.classList.toggle('on',b.dataset.v===v))};
 $('#sExp',md).onclick=exportBackup;$('#sImp',md).onclick=importBackup;$('#sSync',md).onclick=openSyncModal;

   it.img=(await cutout(await srcToCanvas(it.orig||it.img))).toDataURL('image/webp',.9);await DB.put('items',it)}
  delete $('#modal-root').dataset.busy;closeModal();toast(t('recutDone',{n:todo.length}));render()}}
function exportBackup(){const data={app:'fits-desktop',version:1,date:new Date().toISOString(),items:st.items,boards:st.boards,media:Object.values(st.media),plans:st.plans,settings:st.settings};
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data)],{type:'application/json'}));a.download=`fits-backup-${(curProf?.name||'').replace(/[\\/:*?"<>|\s]+/g,'-')}-${ymd(new Date())}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),3000)}

 for(const it of data.items||[])await DB.put('items',it);for(const b of data.boards||[])await DB.put('boards',b);for(const m of data.media||[])await DB.put('media',m);

addEventListener('keydown',e=>{
 if(e.key==='Escape'&&$('#modal-root').children.length){if(!$('#modal-root').dataset.busy)closeModal();return}

 const a=document.activeElement;if(a&&(a.isContentEditable||/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName))){if(e.key==='Escape')a.blur();return}
 const mod=e.ctrlKey||e.metaKey,k=e.key.toLowerCase();
 if(mod&&k==='z'){e.preventDefault();e.shiftKey?redo():undo();return}
 if(mod&&k==='y'){e.preventDefault();redo();return}
 const el=selEl();if(!el)return;
 if(e.key==='Delete'||e.key==='Backspace'){e.preventDefault();selAction('del')}
 else if(mod&&k==='d'){e.preventDefault();selAction('dup')}
 else if(e.key===']')selAction('front');else if(e.key==='[')selAction('back');
 else if(e.key==='Escape')select(null);
 else if(e.key.startsWith('Arrow')){e.preventDefault();const s=e.shiftKey?10:1;if(e.key==='ArrowLeft')el.x-=s;if(e.key==='ArrowRight')el.x+=s;if(e.key==='ArrowUp')el.y-=s;if(e.key==='ArrowDown')el.y+=s;
  const n=$(`#stage .el[data-id="${el.id}"]`);if(n)n.style.cssText=elStyle(el);commit()}});
